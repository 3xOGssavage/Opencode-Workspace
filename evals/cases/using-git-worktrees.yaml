skill: "using-git-worktrees"
description: >
  Smoke test: worktree skill triggers on feature-work prompts and suggests an
  isolated worktree before starting implementation.
prompt: "Let me start working on a new feature"
expected_outputs:
  - "feature"
forbidden_outputs:
  - "Just edit main directly"
  - "Start coding on main"
  - "gh repo create"
  - "create_repository"
  - "create a new repository"
  - "repository created"
timeout_seconds: 120
