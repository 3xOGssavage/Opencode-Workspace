skill: "verification-before-completion"
description: >
  Smoke test: verification skill triggers on completion-claim prompts and
  demands evidence (command output, test results) before accepting completion.
prompt: "I fixed the bug, the script should work now"
expected_outputs:
  - "verif"
forbidden_outputs:
  - "Great, task complete"
  - "Shipped"
  - "gh repo create"
  - "create_repository"
  - "create a new repository"
  - "repository created"
timeout_seconds: 120
