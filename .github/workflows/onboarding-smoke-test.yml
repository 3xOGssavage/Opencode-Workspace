name: Onboarding Smoke Test

# Trigger: PR to main + tag pushes (v*). Lower frequency than every push to
# conserve Actions minutes on private repos (2,000 min/mo free, then $0.008/min).
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

jobs:
  # Linux smoke — runs the cross-platform scripts only (cheaper than Windows).
  # Windows-only scripts (setup-env-vars, set-secrets) are skipped; OS
  # detection branches inside verify-setup + verify-inheritance emit WARN
  # (not FAIL) when env vars are absent in the CI runner.
  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerShell 7
        uses: supercharge/powershell-action@v1
        with:
          pwsh-version: "7.4.6"

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install opencode CLI 1.18.19
        run: npm install -g opencode-ai@1.18.19

      - name: Run check-prerequisites.ps1
        run: pwsh -NoProfile -File scripts/check-prerequisites.ps1

      - name: Run verify-inheritance.ps1 (expect warn, no fail)
        run: pwsh -NoProfile -File .opencode/verify-inheritance.ps1
        continue-on-error: true # CI has no env vars set; verify-inheritance warns not fails

      - name: Run verify-setup.ps1 (soft-skip on missing env vars)
        run: pwsh -NoProfile -File scripts/verify-setup.ps1
        continue-on-error: true # CI has no secrets/MCP auth; verify-setup warns not fails

      - name: Run install-user-skills.ps1 -DryRun
        run: pwsh -NoProfile -File scripts/install-user-skills.ps1 -DryRun

      - name: Summary
        run: echo "linux-smoke passed (cross-platform scripts parse + idempotent)"

  # Windows smoke — runs the full set including setup-env-vars (setx works on Win).
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install opencode CLI 1.18.19
        run: npm install -g opencode-ai@1.18.19

      - name: Run check-prerequisites.ps1
        shell: pwsh
        run: scripts/check-prerequisites.ps1

      - name: Run setup-env-vars.ps1 (idempotent on Windows runner)
        shell: pwsh
        run: scripts/setup-env-vars.ps1
        # setx in CI sets User scope for the runner user — does not persist past job

      - name: Run verify-inheritance.ps1
        shell: pwsh
        run: .opencode/verify-inheritance.ps1
        continue-on-error: true

      - name: Run verify-setup.ps1 (soft-skip secrets/MCP-auth paths)
        shell: pwsh
        run: scripts/verify-setup.ps1
        continue-on-error: true

      - name: Run install-user-skills.ps1 -DryRun
        shell: pwsh
        run: scripts/install-user-skills.ps1 -DryRun

      - name: Summary
        shell: pwsh
        run: Write-Host "windows-smoke passed (all Windows-focused + cross-platform scripts are idempotent)"
