name: Secret Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sundays 17:30 IST (= 12:00 UTC) — after the 16:00 local backup, so the
    # weekly snapshot gets scanned too. Backup branches are never PR'd, so
    # without this the force-added memory file would never be scanned.
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .github/gitleaks.toml
