name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
        with:
          config-path: .github/gitleaks.toml

      - name: Print result
        if: always()
        run: |
          echo "::notice::gitleaks scan complete. If this job failed, a secret was detected. Fix or remove the secret, then re-push. Bypass is not available in CI - the secret scan is the safety net for the local pre-commit hook."

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.sarif
            gitleaks-report.json
          if-no-files-found: ignore
